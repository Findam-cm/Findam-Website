name = "findam"
main = "worker/index.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "usefindam.com/*"
zone_name = "usefindam.com"

[[routes]]
pattern = "www.usefindam.com/*"
zone_name = "usefindam.com"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "LISTINGS"
bucket_name = "findam-listings"
